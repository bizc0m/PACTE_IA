name: Publier LORE D7 (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - "LORE/badges/D7/**"
      - ".github/workflows/publish-d7-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare isolated site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/LORE/badges/D7
          cp LORE/badges/D7/index.html _site/LORE/badges/D7/index.html
          cp LORE/badges/D7/grille.html _site/LORE/badges/D7/grille.html
          touch _site/.nojekyll
          test -s _site/LORE/badges/D7/index.html
          test -s _site/LORE/badges/D7/grille.html
      - name: Upload static content
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
